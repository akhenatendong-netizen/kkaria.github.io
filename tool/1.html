if(action==='open-point'){$('#dialog').close();location.hash='home';toast('Demo collection point opened')}
if(action==='location')modal(`<div class="modal-icon">${icon('pin')}</div><h2>Riverside Community Hub</h2><span class="tag">Fictional collection point · RIV-01</span><p>One example location keeps this prototype focused. No real operator or location data is connected.</p><h3 style="margin-top:22px">Example accepted materials</h3><p>Plastic drinks bottles, aluminium drinks cans, and clean cardboard.</p><a class="btn full" href="#sort" data-action="close">Check an item ${icon('arrow')}</a>`);
if(action==='save'){saved=true;const persisted=save('saved',true);render();toast(persisted?'Collection point saved':'Saved for this session only')}
if(action==='unsave'){saved=false;save('saved',false);render();toast('Collection point removed')}
if(action==='clear-history')modal(`<h2>Clear demo activity?</h2><p>This removes the actions logged on this browser. Your saved collection point stays available.</p><button class="btn full" data-action="confirm-clear">Clear activity</button><button class="btn secondary full" data-action="close">Keep activity</button>`);
if(action==='confirm-clear'){history=[];save('history',history);$('#dialog').close();render();toast('Activity cleared')}
if(action==='feedback')showFeedback();
if(action==='reset-search'){query='';filter='All';render();$('#item-search').focus()}
});
document.addEventListener('input',e=>{if(e.target.id==='item-search'){query=e.target.value;fillItems()}});
document.addEventListener('change',e=>{if(e.target.id==='period'){period=e.target.value;render()}});
document.addEventListener('submit',e=>{if(e.target.id!=='feedback-form')return;e.preventDefault();const value=$('#feedback-text').value.trim();if(!value){$('#feedback-text').setCustomValidity('Please enter a question.');$('#feedback-text').reportValidity();return}const record={type:$('#feedback-type').value,text:value,at:new Date().toISOString()};const feedback=read('feedback',[]);feedback.push(record);const persisted=save('feedback',feedback);modal(`<div class="modal-icon">${icon('check')}</div><h2>${persisted?'Feedback saved.':'Feedback captured for this session.'}</h2><p>No message has been sent. This screen demonstrates the proposed feedback experience.</p><div class="receipt"><strong>${escapeHTML(record.type)}</strong><p>${escapeHTML(record.text)}</p></div><button class="btn full" data-action="close">Done</button>`)});
document.addEventListener('input',e=>{if(e.target.id==='feedback-text')e.target.setCustomValidity('')});
window.addEventListener('hashchange',()=>{render();window.scrollTo(0,0);$('#main').focus({preventScroll:true})});
render();
if(new URLSearchParams(location.search).get('point')==='riverside')toast('Riverside demo collection point opened');
</script>
</body>
</html>
