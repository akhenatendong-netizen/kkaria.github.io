<main class="workspace"><aside class="panel" lang="zh-CN"><div class="brand"><span class="brand-dot"></span>CrazyBee <span class="muted" style="font-weight:400">/ Delivery</span></div><h2>好好吃饭，<br>其余交给我们。</h2><p class="intro">下单后体验 · 浅色主题<br>点击场景，或在页面中体验完整流程。</p><div class="side-label">ORDER EXPERIENCE</div><nav class="scenes" aria-label="演示场景">
<button class="scene active" data-scene="success"><span class="num">01</span>下单成功</button><button class="scene" data-scene="waiting"><span class="num">02</span>等待取货</button><button class="scene" data-scene="delivering"><span class="num">03</span>配送中</button><button class="scene" data-scene="completed"><span class="num">04</span>已完成</button><button class="scene" data-scene="cancelled"><span class="num">05</span>已取消 · 退款中</button><button class="scene" data-scene="cancel"><span class="num">06</span>取消订单</button><button class="scene" data-scene="locked"><span class="num">07</span>配送前 3 小时 · 锁定</button><button class="scene" data-scene="orders"><span class="num">08</span>我的订单</button></nav><div class="note"><strong>保留品牌红色，采用参考的浅色结构。</strong><br>无地图 · 二维码分流 · 低干扰取消入口<br><br>本地交互演示，未连接真实订单、群聊、客服及退款。二维码仅含演示文字。时间固定用于展示取消规则。</div><div class="palette"><span style="background:#f5223d"></span><span style="background:#1c1c28"></span><span style="background:#8f90a6"></span><span style="background:white"></span></div></aside>
<section class="stage" aria-label="Interactive mobile preview"><div class="stage-label"><span>Group delivery</span><span>375 × 812</span></div><div class="phone"><div id="app" class="screen"></div><div id="overlay" class="overlay" hidden></div><div id="toast" class="toast" role="status" aria-live="polite"></div></div><p class="stage-caption" lang="zh-CN">参考页的留白、字体、分隔线与底部操作布局<br>保留红色品牌；英文界面与前置页面一致</p></section></main>

<script>
'use strict';
const $=(s,r=document)=>r.querySelector(s),app=$('#app'),overlay=$('#overlay'),toast=$('#toast');
const paths={check:'<path d="m5 12 4 4 10-10"/>',clock:'<circle cx="12" cy="12" r="9"/><path d="M12 7v5l3 2"/>',pin:'<path d="M19 10c0 5-7 11-7 11S5 15 5 10a7 7 0 1 1 14 0Z"/><circle cx="12" cy="10" r="2.5"/>',group:'<circle cx="9" cy="8" r="3"/><path d="M3 20v-2a6 6 0 0 1 12 0v2M16 5a3 3 0 0 1 0 6m2 3a5 5 0 0 1 3 4v2"/>',chat:'<path d="M4 4h16v12H9l-5 4Z"/><path d="M8 8h8M8 12h5"/>',lock:'<rect x="5" y="10" width="14" height="11" rx="2"/><path d="M8 10V7a4 4 0 0 1 8 0v3m-4 4v3"/>',copy:'<rect x="8" y="8" width="12" height="13" rx="2"/><path d="M16 8V3H3v13h5"/>',edit:'<path d="m15 4 5 5M3 21l2-7L17 2l5 5L10 19Z"/>',bag:'<path d="M5 7h14l2 14H3ZM8 7V5a4 4 0 0 1 8 0v2"/>',home:'<path d="m3 10 9-7 9 7v11H3Zm6 11v-8h6v8"/>',user:'<circle cx="12" cy="7" r="4"/><path d="M4 21v-2a8 8 0 0 1 16 0v2"/>',x:'<path d="m6 6 12 12M6 18 18 6"/>'};
const icon=n=>`<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">${paths[n]||paths.bag}</svg>`;
const asset=n=>`<img class="icon" src="order-flow-assets/${n}.svg" alt="">`;
const esc=s=>String(s).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const model={state:'waiting',locked:false,scene:'success',view:'success',joined:false,reason:'',rating:0,rated:false,name:'Lucas Dong',phone:'979-661-6795',tab:'waiting'};
const scheduledAt=new Date('2026-10-01T11:30:00-07:00').getTime();
const demoNow=()=>new Date(model.locked?'2026-10-01T09:00:00-07:00':'2026-10-01T08:00:00-07:00').getTime();
const canCancel=(state=model.state,now=demoNow())=>state==='waiting'&&scheduledAt-now>3*60*60*1000;
const qrCache={};function qr(type,size=''){if(!qrCache[type]){const q=qrcode(0,'M');q.addData(type==='group'?'DEMO ONLY | CrazyBee | Moffitt Library group':'DEMO ONLY | Order 32414121512 | Pickup A7K9');q.make();qrCache[type]=q.createDataURL(4,16)}return `<img class="qr-image ${size}" src="${qrCache[type]}" alt="${type==='group'?'Group chat':'Pickup'} QR — demo only">`}
const home=()=>'<div class="home-area"><span class="home-pill"></span></div>';
const statusBar=()=>`<div class="statusbar"><span>9:41</span><div class="status-icons">${asset('cellular')}${asset('wifi')}<span class="battery">${asset('cap')}</span></div></div>`;
function shell(title,body,footer='',back='orders'){return `${statusBar()}<header class="navigation"><div class="nav-actions"><button class="icon-button" data-view="${back}" aria-label="Back">${asset('back')}</button><button class="icon-button more" data-view="help" aria-label="Order help">···</button></div><h1>${title}</h1></header><div class="content">${body}</div>${footer?`<footer class="footer">${footer}${home()}</footer>`:home()}`}
const btn=(text,action,kind='')=>`<button class="btn ${kind}" data-action="${action}">${text}</button>`;
const locationRow=()=>`<div class="info-row"><span class="symbol">${icon('pin')}</span><div><h3>Moffitt Library</h3><p class="small muted">Main entrance · Berkeley</p></div></div>`;
const infoRows=()=>`<div class="info-list">${locationRow()}<div class="info-row"><span class="symbol">${icon('clock')}</span><div><h3>Today, 11:30 AM</h3><p class="small muted">Scheduled delivery</p></div></div></div>`;
function community(full=false){return full?`<div class="section-head"><h2>Better together</h2></div><div class="community"><div><div class="community-visual"><span class="community-icon">${icon('group')}</span><h3>Your lunch crew</h3></div><p class="small muted">Pickup updates. Good company.<br>Join your delivery group.</p><button class="link" data-action="group">${model.joined?'View group':'Join group'} &nbsp;→</button></div><button class="qr-button" data-action="group" aria-label="Enlarge group QR">${qr('group')}</button></div>`:`<button class="group-row" data-action="group"><span class="community-icon">${icon('group')}</span><span class="grow"><span class="bold">Delivery group</span><br><span class="small muted">${model.state==='completed'?'Chat available for 24 hours':model.joined?'You’re in · View group details':'Join for pickup updates'}</span></span>${asset('chevron')}</button>`}
const pickup=()=>`<div class="section-head"><h2>Pickup code</h2><span class="small muted">Show at pickup</span></div><div class="ticket"><button class="qr-button" data-action="pickup" aria-label="Enlarge pickup QR">${qr('pickup','large')}</button><div><div class="ticket-label">Your pickup code</div><div class="pickup-number">A7K9</div><button class="copy" data-action="copy">Copy code ${icon('copy')}</button></div></div>`;
const orderLink=()=>`<button class="order-link" data-view="details"><span class="order-mark">${asset('store')}</span><span class="grow"><span class="bold">Domino’s</span><br><span class="small muted">2 items · $21.50</span></span>${asset('chevron')}</button>`;
function progress(){const n={waiting:1,delivering:2,completed:3}[model.state]||0;return `<div class="progress ${model.state}" aria-label="${model.state}">${[1,2,3].map(i=>`<span class="${i<=n?'passed':''}"></span>`).join('')}</div><div class="progress-labels">${['Waiting for pickup','Delivering','Completed'].map((v,i)=>`<span class="${i===n-1?'current':''}">${v}</span>`).join('')}</div>`}
function successView(){return shell('Order placed',`<div class="confirmation"><span class="check">${icon('check')}</span><div><h2>You’re all set!</h2><p class="small muted">Good food is on the way.<br>We’ll notify you when it arrives.</p></div></div>${infoRows()}<div class="dashed"></div>${community(true)}<div class="dashed"></div>${pickup()}`,`<div class="footer-meta"><span class="muted">Order #32414121512</span><span class="green">Paid</span></div><button class="btn cart-button" data-view="status"><span class="cart-left"><span class="quantity">2</span><span class="cart-price">$21.50<small>Total paid</small></span></span><span>Track order &nbsp;→</span></button>`)}
function statusView(){let top,body,foot;if(model.state==='waiting'){top=`<div class="status-label"><span class="status-dot"></span>Waiting for pickup</div><p class="small muted">Scheduled delivery</p><h2 class="arrival">Today, 11:30 AM</h2><p class="small muted">Your order is waiting for driver pickup.</p>${progress()}`;body=`${locationRow()}<div class="dashed"></div>${pickup()}<div class="dashed"></div>${community()}<p class="status-note">${canCancel()?'Free cancellation before 8:30 AM.':'Cancellation closed at 8:30 AM.'}</p>`;foot=`<div class="footer-meta"><button class="quiet small muted" data-view="details">Order details</button><button class="quiet small muted" data-view="help">Order help</button></div>${btn('View pickup code','pickup')}`}
else if(model.state==='delivering'){top=`<div class="status-label"><span class="status-dot"></span>Delivering</div><h2 class="arrival">Your lunch is on its way.</h2><p class="small muted">Scheduled arrival · Today, 11:30 AM</p>${progress()}`;body=`${locationRow()}<div class="timeline"><div class="timeline-row done"><span class="timeline-dot"></span><div><h3>Picked up by driver</h3><p class="small muted">Your order left the restaurant.</p></div><time>11:05 AM</time></div><div class="timeline-row done"><span class="timeline-dot"></span><div><h3>On the way to your pickup point</h3><p class="small muted">We’ll notify you on arrival.</p></div></div></div><div class="dashed"></div>${community()}<div class="dashed"></div>${orderLink()}`;foot=`<div class="footer-meta"><span class="muted">Pickup code <b style="color:var(--ink)">A7K9</b></span><button class="quiet small muted" data-view="help">Order help</button></div>${btn('View pickup code','pickup')}`}
else if(model.state==='completed'){top=`<div class="status-label completed"><span class="status-dot"></span>Completed</div><h2 class="arrival">Enjoy every bite.</h2><p class="small muted">Picked up today at 11:34 AM.</p>${progress()}`;body=`${orderLink()}<div class="dashed"></div><h2>How was your order?</h2><p class="small muted" style="margin-top:8px">A little feedback goes a long way.</p><button class="link" data-action="rate">${model.rated?'Your rating: '+model.rating+' / 5 · Edit':'Leave a rating'} &nbsp;→</button><div class="dashed"></div>${community()}<div class="dashed"></div><button class="order-link" data-view="receipt"><span class="grow"><span class="bold">Receipt</span><br><span class="small muted">2 items · Paid $21.50</span></span>${asset('chevron')}</button>`;foot=`<div class="footer-meta"><span class="muted">Thanks for ordering with us.</span><button class="quiet small muted" data-view="help">Help</button></div>${btn('Order again','reorder')}`}
else{top=`<div class="status-label cancelled"><span class="status-dot"></span>Cancelled</div><h2 class="arrival">Order cancelled</h2><p class="small muted">Today, 8:00 AM</p>`;body=`<div class="refund"><h3>$21.50 refund processing</h3><p class="small">Returning to your original payment method.<br>Estimated in 3–5 business days.</p></div><div class="timeline"><div class="timeline-row done"><span class="timeline-dot"></span><div><h3>Cancellation confirmed</h3><p class="small muted">Your pickup code is no longer valid.</p></div></div><div class="timeline-row done"><span class="timeline-dot"></span><div><h3>Refund initiated</h3><p class="small muted">No action needed on your part.</p></div></div><div class="timeline-row"><span class="timeline-dot"></span><div><h3>Refund received</h3><p class="small muted">Timing depends on your bank.</p></div></div></div><div class="dashed"></div>${orderLink()}${model.reason?`<div class="dashed"></div><p class="small muted">Reason for cancellation</p><p class="small" style="margin-top:6px;overflow-wrap:anywhere">${esc(model.reason)}</p>`:''}`;foot=`<div class="footer-meta"><span class="muted">Need help with your refund?</span><button class="quiet small red" data-action="support">Contact us</button></div>${btn('Order again','reorder')}`}
return shell('Order status',top+(model.state==='cancelled'?'':'<div class="dashed"></div>')+body,foot)}
function helpView(){const allowed=canCancel();return shell('Order help',`<button class="help-item" data-action="support"><span class="symbol">${icon('chat')}</span><span class="grow"><span class="bold">Contact support</span><span class="small muted">Help with this order</span></span>${asset('chevron')}</button><button class="help-item" data-action="contact"><span class="symbol">${icon('edit')}</span><span class="grow"><span class="bold">Pickup contact</span><span class="small muted">${esc(model.name)} · ${esc(model.phone)}</span></span>${asset('chevron')}</button><button class="help-item" data-view="receipt"><span class="symbol">${icon('bag')}</span><span class="grow"><span class="bold">View receipt</span><span class="small muted">Payment and order details</span></span>${asset('chevron')}</button><button class="help-item cancel" data-action="cancel"><span class="symbol">${icon(allowed?'x':'lock')}</span><span class="grow"><span>Cancel order</span><span class="small muted">${allowed?'Available before 8:30 AM':model.state==='cancelled'?'This order is already cancelled.':'Cancellation is unavailable.'}</span></span>${asset('chevron')}</button><div class="policy"><h3>Cancellation policy</h3><p>You can cancel free of charge more than 3 hours before scheduled delivery.</p><p>For today’s 11:30 AM delivery, cancellation closes at <strong>8:30 AM</strong>. At or after this time, the order cannot be cancelled.</p><p>The delivery time and pickup location cannot be changed here. Contact support if you need help.</p></div>`,'','status')}
const totals=()=>`<div class="summary-row"><span>Subtotal</span><span>$17.98</span></div><div class="summary-row"><span>Delivery fee</span><span>$2.00</span></div><div class="summary-row"><span>Taxes & fees</span><span>$1.52</span></div><div class="summary-row total"><span>Total paid</span><strong>$21.50</strong></div>`;
const labels={waiting:'Waiting for pickup',delivering:'Delivering',completed:'Completed',cancelled:'Cancelled'};
function detailsView(receipt=false){return shell(receipt?'Receipt':'Order details',`<h2>Domino’s</h2><p class="small muted" style="margin-top:5px">Group delivery · Berkeley</p><div class="dashed"></div>${infoRows()}<div class="dashed"></div><h2>Your order</h2><div class="item-row"><span class="item-count">2</span><div class="grow"><h3>Pork Chop Curry Set</h3><span class="small muted">Fried pork cutlet + salad + cola</span></div><span>$17.98</span></div><div class="dashed"></div>${totals()}<div class="dashed"></div><h2>Order details</h2><div class="detail-data"><div><div class="micro">Order number</div><p>32414121512</p></div><div><div class="micro">Payment</div><p>Card ·•• 0981</p></div><div><div class="micro">Pickup contact</div><p>${esc(model.name)}</p><p class="small muted">${esc(model.phone)}</p></div><div><div class="micro">Status</div><p>${labels[model.state]}</p></div></div>`,btn('Back to order','back-status','secondary'),'status')}
function ordersView(){const state=model.tab;return shell('My orders',`<div class="tabs" aria-label="Order filters">${Object.entries(labels).map(([k,v])=>`<button class="tab ${state===k?'active':''}" aria-pressed="${state===k}" data-tab="${k}">${v}</button>`).join('')}</div><div class="list-order"><div class="row between"><h2>Domino’s</h2><span class="small ${state==='cancelled'?'muted':state==='completed'?'green':'red'}">${labels[state]}</span></div><p class="small muted" style="margin-top:8px">Today, 11:30 AM · Moffitt Library</p><p class="small" style="margin-top:14px">2 × Pork Chop Curry Set</p><div class="list-actions"><strong>$21.50</strong><button class="btn secondary" data-action="view-list-order">View order</button></div></div><p class="empty">You’re all caught up.</p>`,`<nav class="footer-nav"><button data-action="browse">${icon('home')}Explore</button><button class="active" data-view="orders">${icon('bag')}Orders</button><button data-action="profile">${icon('user')}Account</button></nav>`,'success')}
let returnFocus=null;function render(view=model.view){closeModal(false);model.view=view;app.innerHTML=({success:successView,status:statusView,help:helpView,details:detailsView,receipt:()=>detailsView(true),orders:ordersView})[view]();document.querySelectorAll('[data-scene]').forEach(b=>{b.classList.toggle('active',b.dataset.scene===model.scene);b.setAttribute('aria-pressed',String(b.dataset.scene===model.scene))})}
function modal(title,body,actions){returnFocus=document.activeElement;app.inert=true;overlay.innerHTML=`<section class="dialog" role="dialog" aria-modal="true" aria-labelledby="dialog-title"><div class="handle"></div><div class="dialog-head"><h2 id="dialog-title">${title}</h2><button class="icon-button" data-action="close" aria-label="Close">${asset('close')}</button></div>${body}<div class="actions">${actions}</div>${home()}</section>`;overlay.hidden=false;overlay.querySelector('button')?.focus()}
function closeModal(restore=true){overlay.hidden=true;overlay.innerHTML='';app.inert=false;if(restore&&returnFocus?.isConnected)returnFocus.focus();returnFocus=null}
function showToast(message){toast.textContent=message;toast.classList.add('visible');clearTimeout(showToast.timer);showToast.timer=setTimeout(()=>toast.classList.remove('visible'),3200)}
function cancellation(){if(!canCancel()){const message=model.state==='cancelled'?'This order is already cancelled. Your refund is processing.':model.state==='completed'?'This order has already been completed. Please contact support for order issues.':model.state==='delivering'?'Your order is already being delivered and can no longer be cancelled.':'Your delivery is at 11:30 AM. Cancellation closed at 8:30 AM, 3 hours before delivery.';modal('Cancellation unavailable',`<div class="community-icon" style="margin-bottom:16px">${icon('lock')}</div><p>${message}</p><div class="dialog-note">Need help? Our support team can review your issue.</div>`,btn('Back to order','back-status','secondary')+btn('Contact support','support','text'));return}modal('Cancel this order?',`<p>You can cancel free of charge before 8:30 AM. Your pickup code will no longer be valid.</p><label class="field">Reason (optional)<textarea id="reason" maxlength="300" placeholder="Tell us what changed…">${esc(model.reason)}</textarea></label><div class="dialog-note"><div class="row between"><span>Refund to your card</span><strong>$21.50</strong></div><div class="small muted" style="margin-top:4px">Estimated in 3–5 business days.</div></div>`,btn('Keep order','close','secondary')+btn('Confirm cancellation','confirm-cancel','text'))}
function selectScene(scene){model.scene=scene;model.locked=scene==='locked';model.state=({success:'waiting',waiting:'waiting',cancel:'waiting',locked:'waiting',delivering:'delivering',completed:'completed',cancelled:'cancelled',orders:'waiting'})[scene];model.tab='waiting';render(scene==='success'?'success':scene==='orders'?'orders':scene==='cancel'?'help':'status');if(scene==='cancel')cancellation()}
async function action(name){switch(name){case 'close':closeModal();break;case 'back-status':render('status');break;case 'group':if(model.state==='cancelled'){showToast('Group access is unavailable for cancelled orders.');break}modal('Your delivery group',`<p>Moffitt Library · Today, 11:30 AM<br>Scan to join your group for pickup updates.</p><div class="dialog-qr">${qr('group','full')}<strong>Berkeley lunch crew</strong><p class="demo">Demo QR only · No live group is connected.</p></div>`,btn(model.joined?'Joined · Back to order':'Preview joining group',model.joined?'close':'join'));break;case 'join':model.joined=true;render(model.view);showToast('Joined in this demo. No real group was opened.');break;case 'pickup':if(['completed','cancelled'].includes(model.state)){showToast('This pickup code is no longer active.');break}modal('Your pickup code',`<p>Show this code to the driver at Moffitt Library.</p><div class="dialog-qr">${qr('pickup','full')}<div class="pickup-number">A7K9</div><p class="demo">Demo code · Order #32414121512</p></div>`,btn('Copy pickup code','copy')+btn('Done','close','text'));break;case 'copy':if(['completed','cancelled'].includes(model.state)){showToast('This pickup code is no longer active.');break}try{await navigator.clipboard.writeText('A7K9');showToast('Pickup code copied: A7K9')}catch{showToast('Copy unavailable here. Your pickup code is A7K9.')}break;case 'cancel':cancellation();break;case 'confirm-cancel':if(!canCancel()){cancellation();break}model.reason=$('#reason')?.value.trim()||'';model.state='cancelled';model.scene='cancelled';render('status');showToast('Order cancelled in this demo.');break;case 'contact':if(['completed','cancelled'].includes(model.state)){showToast('Pickup contact cannot be changed after this order closes.');break}modal('Pickup contact',`<p>Update who will collect this order. This does not change the location or delivery time.</p><label class="field">Full name<input id="contact-name" autocomplete="name" maxlength="60" value="${esc(model.name)}"></label><label class="field">Phone number<input id="contact-phone" type="tel" autocomplete="tel" maxlength="25" value="${esc(model.phone)}"></label><div class="error" id="form-error" role="alert"></div>`,btn('Save contact','save-contact'));break;case 'save-contact':{const n=$('#contact-name').value.trim(),p=$('#contact-phone').value.trim();if(n.length<2||p.replace(/\D/g,'').length<7){$('#form-error').textContent='Enter your name and a valid phone number.';break}model.name=n;model.phone=p;render('help');showToast('Pickup contact updated in this demo.');break}case 'support':modal('Contact support',`<p>Tell us what you need help with.<br>Order #32414121512</p><label class="field">Your message<textarea id="support-message" maxlength="1000" placeholder="Describe your issue…"></textarea></label><p class="demo" style="margin-top:10px">Local prototype. No message will be sent.</p><div class="error" id="form-error" role="alert"></div>`,btn('Preview request','send-support'));break;case 'send-support':{const message=$('#support-message').value.trim();if(!message){$('#form-error').textContent='Please enter a message.';break}model.supportMessage=message;modal('Your request preview',`<p>${esc(message)}</p><div class="dialog-note">Saved in this session only. In the live app, this would be sent to the support team.</div>`,btn('Done','close'));break}case 'rate':modal('How was your order?',`<p>Rate your meal and pickup experience.</p><div class="stars" aria-label="Rating">${[1,2,3,4,5].map(n=>`<button class="star ${n<=model.rating?'selected':''}" data-rating="${n}" aria-label="${n} stars" aria-pressed="${n===model.rating}">★</button>`).join('')}</div><div class="error" id="form-error" role="alert"></div>`,btn('Submit rating','save-rating'));break;case 'save-rating':if(!model.rating){$('#form-error').textContent='Choose a star rating first.';break}model.rated=true;render('status');showToast('Thank you! Your demo rating has been saved.');break;case 'reorder':modal('Order again',`<p>2 × Pork Chop Curry Set<br>Domino’s · Moffitt Library</p><div class="dialog-note">Demo total: $21.50<br><span class="small muted">A live checkout would confirm availability, price and delivery time before payment.</span></div>`,btn('Preview a new order','new-order')+btn('Not now','close','text'));break;case 'new-order':model.joined=false;model.reason='';model.rating=0;model.rated=false;selectScene('success');break;case 'view-list-order':model.state=model.tab;model.scene=model.tab;render('status');break;case 'browse':modal('Explore group delivery',`<p>This prototype starts after checkout. Product discovery remains in your existing storefront.</p>`,btn('Preview order placed','new-order')+btn('Back to orders','close','text'));break;case 'profile':modal('Your account',`<div class="detail-data"><div><div class="micro">Name</div><p>${esc(model.name)}</p></div><div><div class="micro">Phone</div><p>${esc(model.phone)}</p></div></div>`,btn('Done','close','secondary'));break}}
document.addEventListener('click',e=>{const scene=e.target.closest('[data-scene]');if(scene){selectScene(scene.dataset.scene);return}const tab=e.target.closest('[data-tab]');if(tab){model.tab=tab.dataset.tab;render('orders');return}const rating=e.target.closest('[data-rating]');if(rating){model.rating=Number(rating.dataset.rating);overlay.querySelectorAll('[data-rating]').forEach(b=>{b.classList.toggle('selected',Number(b.dataset.rating)<=model.rating);b.setAttribute('aria-pressed',String(Number(b.dataset.rating)===model.rating))});return}const view=e.target.closest('[data-view]');if(view){render(view.dataset.view);return}const a=e.target.closest('[data-action]');if(a)action(a.dataset.action);else if(e.target===overlay)closeModal()});
document.addEventListener('keydown',e=>{if(overlay.hidden)return;if(e.key==='Escape'){closeModal();return}if(e.key==='Tab'){const nodes=[...overlay.querySelectorAll('button:not(:disabled),input,textarea')],first=nodes[0],last=nodes[nodes.length-1];if(e.shiftKey&&document.activeElement===first){last.focus();e.preventDefault()}else if(!e.shiftKey&&document.activeElement===last){first.focus();e.preventDefault()}}});
render('success');
</script></body></html>
