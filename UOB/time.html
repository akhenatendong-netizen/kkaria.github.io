<script>
const DATA=JSON.parse(document.getElementById('course-data').textContent);let week=1;const activeBlocks=new Set(['TB1','TB2']);let group='全部';
const days=['周一','周二','周三','周四','周五','周六','周日'];const zhType={Lecture:'讲座',Workshop:'工作坊',Seminar:'研讨课'};
const fmt=d=>new Intl.DateTimeFormat('zh-CN',{month:'long',day:'numeric'}).format(new Date(d+'T12:00:00'));
function render(){const info=DATA.weeks[week-1],all=DATA.events.filter(e=>e.week===week),ev=all.filter(e=>activeBlocks.has(e.block)&&(group==='全部'||e.group===group));document.getElementById('weekTitle').textContent=`第 ${week} 周`;document.getElementById('prev').disabled=week===1;document.getElementById('next').disabled=week===24;
 const year=new Date(info.start+'T12:00:00').getFullYear();document.getElementById('weekRange').textContent=`${fmt(info.start)} – ${fmt(info.end)} · ${year}年`;const cal=document.getElementById('calendar');cal.innerHTML='<div class="head">时间</div>'+days.map((d,i)=>{const x=new Date(info.start+'T12:00:00');x.setDate(x.getDate()+i);return `<div class="head">${d}<small>${x.getMonth()+1}/${x.getDate()}</small></div>`}).join('');
 if(!ev.length){cal.insertAdjacentHTML('beforeend',`<div class="empty"><div><b>${all.length?'当前筛选下没有课程':'本周暂无课程'}</b>${[6,18].includes(week)?`第 ${week} 周为无排课周，可安心安排复习或项目。`:'可切换周次或调整筛选条件。'}</div></div>`)}else{const slots=[...new Set(ev.map(e=>`${e.start}|${e.end}`))].sort((a,b)=>a.localeCompare(b));for(const slot of slots){const [start,end]=slot.split('|');const label=document.createElement('div');label.className='time-label';label.innerHTML=`${start}<br>–<br>${end}`;cal.appendChild(label);for(let d=0;d<7;d++){const cell=document.createElement('div');cell.className='day-cell';const source=ev.filter(e=>e.day===d&&e.start===start&&e.end===end);const merged=[];for(const e of source){let m=merged.find(x=>x.unitCode===e.unitCode&&x.type===e.type&&x.block===e.block);if(!m){m={...e,details:[]};merged.push(m)}m.details.push({group:e.group,room:e.room,staff:e.staff})}for(const m of merged){const groups=m.details.map(x=>x.group).filter(x=>x!=='全体').sort().join('');const node=document.createElement('article');node.className='event '+m.block.toLowerCase();const detail=m.details.length===1?`<div class="meta">📍 ${m.details[0].room}</div><div class="meta">👤 ${m.details[0].staff||'未标注'}</div>`:`<div class="group-detail">${m.details.map(x=>`<div class="group-line"><b>${x.group}组</b> · 📍 ${x.room}<br>👤 ${x.staff||'未标注'}</div>`).join('')}</div>`;node.innerHTML=`<div><span class="tag">${m.block}</span><span class="tag">${groups?groups+'组':'全体'}</span><span class="tag">${zhType[m.type]||m.type}</span></div><div class="event-title">${m.unit}</div><div class="meta">⏱ ${m.start}–${m.end}</div>${detail}<div class="meta">${m.unitCode}</div>`;cell.appendChild(node)}cal.appendChild(cell)}}}
 const notice=document.getElementById('notice');notice.classList.remove('show');notice.textContent='';document.getElementById('summary').textContent=`本周显示 ${ev.length} 项 · 原始 ${all.length} 项`;
}
document.querySelectorAll('[data-block]').forEach(b=>b.onclick=()=>{const x=b.dataset.block;activeBlocks.has(x)?activeBlocks.delete(x):activeBlocks.add(x);b.classList.toggle('active');render()});document.getElementById('group').onchange=e=>{group=e.target.value;render()};document.getElementById('prev').onclick=()=>{if(week>1){week--;render()}};document.getElementById('next').onclick=()=>{if(week<24){week++;render()}};document.getElementById('today').onclick=()=>{week=1;render()};document.addEventListener('keydown',e=>{if(e.key==='ArrowLeft'&&week>1){week--;render()}if(e.key==='ArrowRight'&&week<24){week++;render()}});render();
</script>
